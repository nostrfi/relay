name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The Release workflow starts this on a v* tag after release-please makes
  # the tag (a tag created with GITHUB_TOKEN starts no tag-push workflows).
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DASHBOARD_IMAGE_NAME: ${{ github.repository }}-dashboard

jobs:
  # ── Version ────────────────────────────────────────────────────
  # The version comes from the release tag that release-please creates. A run
  # on a v* tag is a release build; anything else is a development build.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      majorMinor: ${{ steps.version.outputs.majorMinor }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
      promoteLatest: ${{ steps.version.outputs.promoteLatest }}
      promoteMinor: ${{ steps.version.outputs.promoteMinor }}
    steps:
      - name: Determine version
        id: version
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          sha="${SHA:0:7}"
          if [[ "$REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            majorMinor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            release=true
          else
            version="dev-$sha"
            majorMinor=""
            release=false
          fi
          # Mutable aliases only move forward: a rebuild of an older release
          # keeps its own version tag but must not take over latest, or its
          # minor-line alias from a newer patch.
          promoteLatest=false
          promoteMinor=false
          if [ "$release" = true ]; then
            tags="$(git ls-remote --tags --refs "$REPO_URL" 'v*' \
              | sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p')"
            highest="$(printf '%s\n%s\n' "$tags" "$version" | sed '/^$/d' | sort -V | tail -n1)"
            highestMinor="$(printf '%s\n%s\n' "$tags" "$version" | awk -F. -v mm="$majorMinor" '$1"."$2 == mm' | sort -V | tail -n1)"
            [ "$version" = "$highest" ] && promoteLatest=true
            [ "$version" = "$highestMinor" ] && promoteMinor=true
          fi
          {
            echo "version=$version"
            echo "majorMinor=$majorMinor"
            echo "sha=$sha"
            echo "release=$release"
            echo "promoteLatest=$promoteLatest"
            echo "promoteMinor=$promoteMinor"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release, latest: $promoteLatest, minor alias: $promoteMinor)"

  # ── Build & test (backend) ───────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: version
    outputs:
      version: ${{ needs.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download deps
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build (with version injection)
        working-directory: backend
        env:
          CGO_ENABLED: 1
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o /tmp/relay ./cmd/relay

      - name: Test
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./tests/...

      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.version.outputs.version }}
          path: backend/coverage.out
          retention-days: 14

      # Docker metadata — release builds get the version tags and latest;
      # development builds get sha-<shortsha> only
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.majorMinor }},enable=${{ needs.version.outputs.promoteMinor == 'true' }}
            type=raw,value=sha-${{ needs.version.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.version.outputs.promoteLatest == 'true' }}
          labels: |
            org.opencontainers.image.title=Nostrfi Relay
            org.opencontainers.image.description=A custom Nostr relay configured via YAML
            org.opencontainers.image.source=https://github.com/nostrfi/relay
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  # ── Linux release binary (glibc) ────────────────────────────────
  # Builds the binary the way the Release workflow does, in the same
  # golang:1.26-bookworm image, and fails if it needs a glibc newer than 2.36
  # (Debian 12, Ubuntu 23.04+). Keep the build command in step with
  # release.yml's binary job.
  binary-glibc:
    name: Linux Binary glibc Check
    runs-on: ubuntu-latest
    needs: version
    container: golang:1.26-bookworm
    # Steps in a container default to sh; the scripts here need bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the Linux binary
        working-directory: backend
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -ldflags="-s -w -X main.version=$VERSION" -o ../dist/relay-linux-amd64 ./cmd/relay

      - name: Check the glibc requirement
        run: .github/scripts/check-glibc.sh dist/relay-linux-amd64 2.36

  # ── Build & check (frontend) ─────────────────────────────────────
  frontend:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    needs: version
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # frontend/package.json's "packageManager" field pins the same
          # version, but pnpm/action-setup only auto-detects that field from
          # a repo-root package.json — ours lives in frontend/, so it's
          # passed explicitly here instead.
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

      # Docker metadata — mirrors the backend's tagging scheme
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.majorMinor }},enable=${{ needs.version.outputs.promoteMinor == 'true' }}
            type=raw,value=sha-${{ needs.version.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.version.outputs.promoteLatest == 'true' }}
          labels: |
            org.opencontainers.image.title=Nostrfi Relay Dashboard
            org.opencontainers.image.description=Admin dashboard for the Nostrfi relay
            org.opencontainers.image.source=https://github.com/nostrfi/relay
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  # ── Docker build & push (backend) ─────────────────────────────────
  package:
    name: Package & Publish
    runs-on: ubuntu-latest
    needs: [version, build]
    # Push to GHCR on master pushes and release-tag runs — not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ needs.build.outputs.tags }}
          labels: ${{ needs.build.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

  # ── Docker build & push (dashboard) ───────────────────────────────
  package-dashboard:
    name: Package & Publish Dashboard
    runs-on: ubuntu-latest
    needs: [version, frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ needs.frontend.outputs.tags }}
          labels: ${{ needs.frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
