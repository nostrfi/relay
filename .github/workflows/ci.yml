name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DASHBOARD_IMAGE_NAME: ${{ github.repository }}-dashboard

jobs:
  # ── Version ────────────────────────────────────────────────────
  version:
    name: GitVersion
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      preReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}
      isPrerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
      commitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}
      sha: ${{ steps.gitversion.outputs.sha }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Display version
        run: |
          echo "SemVer:               ${{ steps.gitversion.outputs.semVer }}"
          echo "MajorMinorPatch:      ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "AssemblySemVer:       ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "PreReleaseTag:        ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "PreReleaseTagWithDash: ${{ steps.gitversion.outputs.preReleaseTagWithDash }}"
          echo "CommitsSinceVersion:  ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
          echo "Sha:                  ${{ steps.gitversion.outputs.sha }}"

  # ── Build & test (backend) ───────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: version
    outputs:
      version: ${{ needs.version.outputs.semVer }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download deps
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build (with version injection)
        working-directory: backend
        env:
          CGO_ENABLED: 1
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ needs.version.outputs.semVer }}" \
            -o /tmp/relay ./cmd/relay

      - name: Test
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./tests/...

      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ needs.version.outputs.semVer }}
          path: backend/coverage.out
          retention-days: 14

      # Docker metadata — uses GitVersion outputs for tagging
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Full semver: 1.2.3 or 1.2.3-alpha.1
            type=raw,value=${{ needs.version.outputs.semVer }}
            # Major.Minor.Patch (same as semver for stable, without prerelease suffix)
            type=raw,value=${{ needs.version.outputs.majorMinorPatch }}
            # Git short SHA
            type=raw,value=sha-${{ needs.version.outputs.sha }}
            # latest only when not a prerelease
            type=raw,value=latest,enable=${{ needs.version.outputs.isPrerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Nostrfi Relay
            org.opencontainers.image.description=A custom Nostr relay configured via YAML
            org.opencontainers.image.source=https://github.com/nostrfi/relay
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.semVer }}

  # ── Build & check (frontend) ─────────────────────────────────────
  frontend:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    needs: version
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # frontend/package.json's "packageManager" field pins the same
          # version, but pnpm/action-setup only auto-detects that field from
          # a repo-root package.json — ours lives in frontend/, so it's
          # passed explicitly here instead.
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

      # Docker metadata — mirrors the backend's tagging scheme
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.semVer }}
            type=raw,value=${{ needs.version.outputs.majorMinorPatch }}
            type=raw,value=sha-${{ needs.version.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.version.outputs.isPrerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Nostrfi Relay Dashboard
            org.opencontainers.image.description=Admin dashboard for the Nostrfi relay
            org.opencontainers.image.source=https://github.com/nostrfi/relay
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.semVer }}

  # ── Docker build & push (backend) ─────────────────────────────────
  package:
    name: Package & Publish
    runs-on: ubuntu-latest
    needs: [version, build]
    # Push to GHCR only on main or tag pushes — not PRs
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ needs.build.outputs.tags }}
          labels: ${{ needs.build.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.semVer }}

  # ── Docker build & push (dashboard) ───────────────────────────────
  package-dashboard:
    name: Package & Publish Dashboard
    runs-on: ubuntu-latest
    needs: [version, frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ needs.frontend.outputs.tags }}
          labels: ${{ needs.frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release on tag ────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build release binary (linux amd64)
        working-directory: backend
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build \
            -ldflags="-s -w -X main.version=${{ needs.version.outputs.semVer }}" \
            -o ../dist/relay-linux-amd64 ./cmd/relay
          tar -czf ../dist/relay-linux-amd64.tar.gz -C ../dist relay-linux-amd64

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n1)

          {
            echo "## Nostrfi Relay ${CURRENT_TAG}"
            echo
            echo "**Full version:** ${{ needs.version.outputs.informationalVersion }}"
            echo "**Commits since last version source:** ${{ needs.version.outputs.commitsSinceVersionSource }}"
            echo
            echo "---"
            echo
            echo "## Changelog"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
              echo
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)"
              echo
            else
              echo "Initial release."
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.version.outputs.semVer }}
          body_path: release-notes.md
          files: dist/*.tar.gz
          draft: false
          prerelease: ${{ needs.version.outputs.isPrerelease == 'true' }}
