name: Release

# Merging the release-please release PR is the release. release-please then
# creates the v<version> tag and a *draft* GitHub release; this workflow
# builds the Linux binary from the tag, attaches it, publishes the release,
# starts the CI image build for the tag, and closes the version's milestone.
# See docs/releasing.md.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to finish publishing, e.g. v0.1.0"
        required: true
        type: string
      binary:
        description: "Build and attach the binary (only while the release is still a draft)"
        type: boolean
        default: true
      images:
        description: "Build and push the container images for the tag"
        type: boolean
        default: true

# Queue, never cancel: two fast merges must not race into duplicate tags or
# releases.
concurrency:
  group: relay-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  # Which tag the rest of the run works on: the one release-please just made,
  # or the one typed into a manual run. Downstream jobs need !cancelled(),
  # because release-please is skipped on a manual run.
  resolve:
    needs: release-please
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      binary: ${{ steps.tag.outputs.binary }}
      images: ${{ steps.tag.outputs.images }}
    steps:
      - name: Resolve and validate the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BINARY: ${{ inputs.binary }}
          INPUT_IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"; binary="$INPUT_BINARY"; images="$INPUT_IMAGES"
          else
            tag="$CREATED_TAG"; binary=true; images=true
          fi
          if ! printf '%s' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$tag' is not a release tag of the form v1.2.3."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "binary=$binary"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  close-milestone:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the version's milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          number="$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number")"
          if [ -z "$number" ]; then
            echo "::notice::No open milestone named $VERSION; nothing to close."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed --silent
          echo "Closed milestone $VERSION (#$number)"

  binary:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.binary == 'true' }}
    runs-on: ubuntu-latest
    # The binary links DuckDB through CGO, so it needs at least the glibc of
    # the machine that built it. Build in the same image as backend/Dockerfile
    # (glibc 2.36), not on the runner, whose glibc follows ubuntu-latest: v0.2.0
    # built there needed GLIBC_2.43 and would not start on Ubuntu 24.04.
    container: golang:1.26-bookworm
    # Steps in a container default to sh; the scripts here need bash.
    defaults:
      run:
        shell: bash
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Trust the checkout for git
        # The container runs as root over a runner-owned checkout; without
        # this, go build cannot read git status for VCS stamping.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the version file matches the tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < version.txt)"
          if [ "$file_version" != "$VERSION" ]; then
            echo "::error::version.txt says $file_version but the tag is v$VERSION."
            exit 1
          fi

      - name: Build the Linux binary
        id: build
        working-directory: backend
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -ldflags="-s -w -X main.version=$VERSION" -o ../dist/relay-linux-amd64 ./cmd/relay
          ../.github/scripts/check-glibc.sh ../dist/relay-linux-amd64 2.36
          tar -czf ../dist/relay-linux-amd64.tar.gz -C ../dist relay-linux-amd64
          sha256="$(sha256sum ../dist/relay-linux-amd64.tar.gz | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "relay-linux-amd64.tar.gz sha256 $sha256"

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-linux-amd64
          path: dist/relay-linux-amd64.tar.gz
          retention-days: 7
          if-no-files-found: error

  # A tag made with GITHUB_TOKEN does not start tag-push workflows, so the
  # image build is started explicitly on the tag ref, and this job waits for
  # it: the release is only published once its images exist.
  images:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.images == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Build and push the images for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event workflow_dispatch --branch "$TAG" --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::The CI run for $TAG did not appear within five minutes."
            exit 1
          fi
          echo "Waiting for CI run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status

  publish-release:
    needs: [resolve, binary, images]
    # Publish only when the binary built and the images either built or were
    # deliberately not requested on a manual run.
    if: >-
      !cancelled() &&
      needs.binary.result == 'success' &&
      (needs.images.result == 'success' || needs.resolve.outputs.images != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-linux-amd64
          path: dist

      - name: Check the archive is the one the build made
        env:
          EXPECTED: ${{ needs.binary.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/relay-linux-amd64.tar.gz | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Archive checksum $actual does not match the build's $EXPECTED."
            exit 1
          fi

      - name: Attach the binary and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::notice::Release $TAG is already published; its assets are left as they are."
            exit 0
          fi
          gh release upload "$TAG" dist/relay-linux-amd64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $TAG"
