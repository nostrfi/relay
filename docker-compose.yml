services:
  relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # RELAY_VERSION selects which CI-published tag to run — see README.md's
    # "Deployment" section for the rollback recipe. Unset, this still builds
    # and tags locally exactly as before (`docker compose up --build`).
    image: ghcr.io/nostrfi/relay:${RELAY_VERSION:-latest}
    container_name: nostrfi-relay
    restart: unless-stopped
    # 8080 only. The metrics listener (2112, below) is deliberately absent:
    # it is reachable from the Compose network — the dashboard and any
    # scraper you attach to it — and from nowhere else.
    ports:
      - "8080:8080"
    volumes:
      # Persist DuckDB across container restarts
      - relay-db:/app/db
      # Override config without rebuilding the image
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - LOG_LEVEL=info
      # config.yaml binds /metrics to loopback, which inside a container
      # means this container alone — and the dashboard is a different one.
      # Bound to the container's network instead, still unpublished, so
      # "internal" is enforced by the missing port mapping above rather than
      # by the bind address (nostrfi/workspace#53).
      - RELAY_METRICS_LISTEN_ADDR=:2112
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # DASHBOARD_VERSION mirrors RELAY_VERSION's rollback recipe, pinning
    # which CI-published dashboard image tag to run.
    image: ghcr.io/nostrfi/relay-dashboard:${DASHBOARD_VERSION:-latest}
    container_name: nostrfi-relay-dashboard
    restart: unless-stopped
    depends_on:
      - relay
    # No host port mapping: only reachable via the Caddy overlay's /admin
    # route (docker-compose.tls.yml), or via `docker compose exec`/internal
    # network access for local debugging.
    environment:
      - NUXT_RELAY_API_BASE=http://relay:8080
      # The metrics listener is a second address, so the dashboard is told
      # both. Same host, different port; the browser sees neither.
      - NUXT_RELAY_METRICS_BASE=http://relay:2112
      # Seals the admin session cookie. Required — the dashboard refuses to
      # open a session without it, rather than falling back to a known
      # secret. Generate one per deployment: `openssl rand -base64 48`.
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD, e.g. in a .env file}
      # Which pubkey may sign in. Defaults to the relay's NIP-11 pubkey when
      # empty; set it when the relay's moderation.admin_pubkey differs, and
      # keep the two in step.
      - NUXT_ADMIN_PUBKEY=${NUXT_ADMIN_PUBKEY:-}
    healthcheck:
      # node:22-bookworm-slim has no wget; healthcheck.js uses Node's
      # built-in fetch instead, avoiding an apt-get layer just for this.
      # A script file (not an inline `-e` string) because the Docker Engine
      # API's CMD-array healthcheck test gets word-split by at least one
      # container engine in local use here even though each `-e` argument
      # is a single Compose YAML scalar — a script file sidesteps that by
      # keeping every CMD array element free of embedded whitespace.
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay-db:
