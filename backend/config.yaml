relay_info:
  name: "Nostrfi Relay"
  description: "A custom Nostr relay configured via YAML."
  pubkey: "ec642f38bfef46ab7bcdb5aea1dcdc98ca20cbb4cec7fa1066cafbb5a8b07008"
  contact: "admin@example.com"
  supported_nips: [1, 2, 9, 11, 17, 22, 28, 40, 42, 50, 70, 71, 77, 86, 98]
  software: "https://github.com/nostrfi/relay"
  limitation:
    max_message_length: 65536
    max_subscriptions: 100
    max_filters: 20
    max_limit: 500
    max_subid_length: 64
    max_event_tags: 2000
    max_content_length: 65536
    min_pow_difficulty: 0
    auth_required: false
    payment_required: false
    restricted_writes: false
    created_at_lower_limit: 94608000 # 3 years, in seconds
    created_at_upper_limit: 900 # 15 minutes, in seconds

resource_limits:
  max_connections: 1000
  messages_per_second: 20
  events_per_second: 5
  search_timeout_seconds: 5 # a NIP-50 search past this budget is cancelled and answered with CLOSED; 0 disables

auth:
  relay_url: "" # set to this relay's canonical wss:// URL to enable NIP-42 endpoint binding
  max_event_age_seconds: 600 # NIP-42 AUTH events older or further in the future than this are rejected

moderation:
  admin_pubkey: "" # NIP-86 management API caller must sign as this pubkey (NIP-98); defaults to relay_info.pubkey when empty
  max_event_age_seconds: 60 # NIP-98 auth events older or further in the future than this are rejected

websocket:
  # "development" accepts a browser connection from any Origin — the right
  # mode for a relay meant to serve arbitrary web clients (the public
  # reusable model; re-decided under nostrfi/workspace#45). The relay warns
  # at startup when this mode binds a non-loopback interface, so the choice
  # is visible. "production" restricts browsers to allowed_origins.
  # Non-browser clients send no Origin and are admitted in both modes.
  mode: "development"
  allowed_origins: [] # required (non-empty) when mode is "production"

retention:
  purge_interval_seconds: 3600 # how often expired events (and their tags) are deleted and the database checkpointed

server:
  listen_addr: ":8080"
  # /metrics is served here and nowhere else. Loopback by default: the
  # exposition describes this host, and the public listener above is not the
  # place for it. A scraper elsewhere on the network needs this changed and
  # the port reached deliberately — docker-compose.yml sets it via
  # RELAY_METRICS_LISTEN_ADDR without publishing the port.
  metrics_listen_addr: "127.0.0.1:2112"
  shutdown_timeout_seconds: 5

storage:
  db_path: "db/relay.db" # shared by normal startup and the -backup/-restore flags
